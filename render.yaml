services:
  - type: pserv
    runtime: docker
    name: chicken-ai
    region: singapore
    plan: 2c-4g
    rootDir: ai-service
    dockerfilePath: ./ai-service/Dockerfile
    dockerContext: ./ai-service
    maxShutdownDelaySeconds: 120
    envVars:
      - key: PORT
        value: "10000"
      - key: AI_THREADS
        value: "2"
      - key: AI_MAX_PENDING
        value: "20"
      - key: AI_SERVICE_KEY
        sync: false
      - key: AI_CALLBACK_SECRET
        sync: false
      - key: AI_CALLBACK_URL
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
